name: Build Supernova Preview

on:
  push:
    branches: [mobile/capacitor]
  workflow_dispatch:
    inputs:
      draft_release:
        type: boolean
        description: Prepare a draft release after all packages build
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CYPRESS_INSTALL_BINARY: '0'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Set up Android JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate native project
        run: pnpm exec cap add ${{ matrix.platform }}
      - name: Build Android APK
        if: matrix.platform == 'android'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Supernova-Android.apk
      - name: Build unsigned iPhone IPA
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          python3 scripts/prepare-ios.py
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/supernova-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/supernova-ios/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Supernova-unsigned.ipa Payload
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: Supernova-Android
          path: Supernova-Android.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned iPhone IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: Supernova-iOS
          path: ${{ runner.temp }}/ipa/Supernova-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Package Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CYPRESS_INSTALL_BINARY: '0'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm electron:build
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Package DEB, RPM and AppImage
        run: |
          set -euo pipefail
          pnpm exec electron-builder --linux deb rpm AppImage --x64 --publish never
          mkdir -p preview-assets
          cp dist/*.deb preview-assets/Supernova-Desktop-amd64.deb
          cp dist/*.rpm preview-assets/Supernova-Desktop-x86_64.rpm
          cp dist/*.AppImage preview-assets/Supernova-Desktop-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Supernova-Linux
          path: preview-assets/
          if-no-files-found: error

  draft:
    name: Assemble draft release
    if: github.ref == 'refs/heads/mobile/capacitor' && (github.event_name == 'push' || inputs.draft_release)
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: preview-assets
          merge-multiple: true
      - name: Verify packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            Supernova-Desktop-amd64.deb
            Supernova-Desktop-x86_64.rpm
            Supernova-Desktop-x86_64.AppImage
            Supernova-Android.apk
            Supernova-unsigned.ipa
          )
          (
            cd preview-assets
            sha256sum "${assets[@]}" > SHA256SUMS
          )
          tag="mobile-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" preview-assets/* --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "Supernova desktop and mobile preview ${GITHUB_RUN_NUMBER}" \
            --notes-file PREVIEW.md
